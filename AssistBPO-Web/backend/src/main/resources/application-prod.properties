# ===========================================
# CONFIGURAÇÕES DE PRODUÇÃO - RENDER POSTGRES
# ===========================================

# ===================== SERVER =====================
server.port=${PORT:8080}
server.servlet.context-path=/
server.compression.enabled=true
server.error.include-message=never
server.error.include-binding-errors=never

# ===================== DATABASE - RENDER POSTGRES =====================
# Use variáveis separadas (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD)
# Adicione &stringtype=unspecified na URL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&stringtype=unspecified
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configurações de pool de conexões otimizadas
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.validation-timeout=5000

# SSL obrigatório para Render PostgreSQL
spring.datasource.hikari.ssl=true
spring.datasource.hikari.sslmode=require

# ===================== JPA / HIBERNATE =====================
# EM PRODUÇÃO: NUNCA use update/create! Use validate ou none
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Dialeto PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ===================== LOGGING =====================
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
logging.level.com.assistbpo=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Desabilitar console do H2 em produção
spring.h2.console.enabled=false

# ===================== CACHE =====================
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# ===================== SECURITY =====================
# Headers de segurança
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# ===================== MONITORING =====================
# Health check endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# ===================== PERFORMANCE =====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================== CORS PRODUÇÃO =====================
# Ajuste com seu domínio do frontend no Render
spring.web.cors.allowed-origins=${FRONTEND_URL:https://assistbpo-frontend.onrender.com}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true