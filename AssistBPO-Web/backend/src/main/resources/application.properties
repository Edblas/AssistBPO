# ===================== CONFIGURAÇÕES DE PORTA =====================
server.port=${PORT:8080}

# ===================== ENCODING CORRETO =====================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===================== LOGGING =====================
# Produção: INFO para evitar disco cheio/lentidão com 1000 usuários
logging.level.org.springframework=INFO
logging.level.com.assistbpo=INFO

# ===================== COMPRESSÃO (GZIP) =====================
# Reduz tamanho do JSON em até 70% - CRÍTICO para performance
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ===================== DATABASE CONFIG =====================
# Configuração com variáveis (Render substituirá automaticamente)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/assistbpo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ===================== CONNECTION POOLING (HikariCP) =====================
# Configurações otimizadas para escala (até 1000 usuários)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=AssistBPO-Pool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ===================== PROFILE =====================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===================== ACTUATOR =====================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always